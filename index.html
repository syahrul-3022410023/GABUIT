<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buket Untuk Kamu</title>
    <meta name="description" content="Buket bunga sederhana dengan pesan manis untuk menceriakan hari.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="bouquet-card">
            <p class="eyebrow">Bunga kecil buat kamu</p>
            <h1>Jangan bad mood lagi ya</h1>

            <button class="bouquet-button" id="bouquetButton" aria-label="Ambil buket bunga">
                <span class="sparkle sparkle-one"></span>
                <span class="sparkle sparkle-two"></span>
                <svg class="bouquet" viewBox="0 0 220 260" aria-hidden="true">
                    <path class="wrap shadow" d="M68 112 L152 112 L132 240 L88 240 Z"/>
                    <path class="stem" d="M110 92 C108 132 104 168 98 220"/>
                    <path class="stem" d="M110 94 C116 135 122 171 126 220"/>
                    <path class="stem" d="M110 94 C112 140 111 175 112 224"/>

                    <g class="flower flower-one">
                        <circle cx="72" cy="78" r="17"/>
                        <circle cx="88" cy="62" r="17"/>
                        <circle cx="105" cy="77" r="17"/>
                        <circle cx="90" cy="91" r="17"/>
                        <circle class="center" cx="90" cy="77" r="11"/>
                    </g>

                    <g class="flower flower-two">
                        <circle cx="121" cy="49" r="16"/>
                        <circle cx="139" cy="61" r="16"/>
                        <circle cx="132" cy="82" r="16"/>
                        <circle cx="109" cy="80" r="16"/>
                        <circle class="center" cx="124" cy="68" r="10"/>
                    </g>

                    <g class="flower flower-three">
                        <circle cx="143" cy="93" r="15"/>
                        <circle cx="160" cy="106" r="15"/>
                        <circle cx="150" cy="126" r="15"/>
                        <circle cx="128" cy="118" r="15"/>
                        <circle class="center" cx="145" cy="110" r="9"/>
                    </g>

                    <path class="leaf leaf-left" d="M93 135 C58 120 51 155 84 159"/>
                    <path class="leaf leaf-right" d="M123 143 C162 126 169 164 134 166"/>
                    <path class="wrap" d="M65 112 L155 112 L133 244 L87 244 Z"/>
                    <path class="ribbon" d="M78 165 C96 178 123 178 142 165"/>
                    <path class="ribbon-tail" d="M102 173 L86 205 L112 190"/>
                    <path class="ribbon-tail" d="M118 173 L135 205 L109 190"/>
                </svg>
            </button>

            <button class="take-button" id="takeButton">Ambil Buket</button>

            <div class="message-box" id="messageBox" aria-live="polite">
                <p class="message-title">Buketnya sudah kamu ambil.</p>
                <p>
                    Jangan bad mood lagi ya. Kamu boleh capek, boleh diam sebentar,
                    tapi jangan lupa kalau kamu tetap berharga dan pantas disayang.
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
